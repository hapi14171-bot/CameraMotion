<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTION DETECTOR ALARM</title>
<style>
body { background:#000; color:#f00; font-family:monospace; text-align:center; margin:0; }
#wrap { position:relative; width:100%; max-width:640px; height:480px; margin:10px auto; border:3px solid #f00; }
video, canvas { position:absolute; top:0; left:0; width:100%; height:480px; }
#status { font-size:24px; margin:10px; }
#alert { font-size:40px; color:#ff0; display:none; animation:blink 0.5s infinite; }
@keyframes blink { 50% { opacity:0; }
button { padding:15px 25px; background:#f00; color:#000; border:none; font-weight:bold; font-size:16px; cursor:pointer; margin:5px; }
</style>
</head>
<body>
<h2>> MOTION DETECTOR ALARM</h2>
<div id="status">Status: SAFE</div>
<div id="alert">⚠️ MOTION DETECTED! ⚠️</div>
<div id="wrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>
<button id="btn">CLICK TO START CAMERA</button>
<button id="resetBtn">RESET ALARM</button>
<audio id="alarmSound" src="https://www.soundjay.com/mechanical/sounds/alarm-clock-01.mp3"></audio>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const btn = document.getElementById('btn');
const resetBtn = document.getElementById('resetBtn');
const status = document.getElementById('status');
const alert = document.getElementById('alert');
const alarmSound = document.getElementById('alarmSound');

let previousFrame = null;
let alarmActive = false;

btn.onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});
  video.srcObject = stream;
  btn.style.display = 'none';
  detectMotion();
}

resetBtn.onclick = () => {
  alarmActive = false;
  status.innerText = "Status: SAFE";
  alert.style.display = "none";
  alarmSound.pause();
  alarmSound.currentTime = 0;
}

function detectMotion(){
  const ctx = canvas.getContext('2d');
  
  setInterval(() => {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
    if(previousFrame){
      let motion = 0;
      // I-co-compare yung 2 frames. Pag malaki pinagbago = may galaw
      for(let i = 0; i < currentFrame.data.length; i += 4){
        let diff = Math.abs(currentFrame.data[i] - previousFrame.data[i]);
        if(diff > 30) motion++;
      }
      
      // Pag sobrang daming nagbago = ALARM
      if(motion > 5000 &&!alarmActive){
        alarmActive = true;
        status.innerText = "Status: INTRUDER!!!";
        alert.style.display = "block";
        alarmSound.play();
        console.log("MOTION: " + motion);
      }
    }
    previousFrame = currentFrame;
  }, 200); // Check every 0.2 seconds
}
</script>
</body>
</html>
